name: Deploy to GCP
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # 1. Authenticate with Google Cloud securely
    - id: auth
      uses: google-github-actions/auth@v1
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    # 2. Set up the Google Cloud CLI
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    # 3. Use gcloud to SSH into the VM safely
    - name: Deploy to VM
      run: |
        gcloud compute ssh web-001 --zone=us-central1-c --command="
          cd ~/node-app &&
          git pull origin main &&
          npm install &&
          pm2 restart app || pm2 start index.js --name 'app'
        "
